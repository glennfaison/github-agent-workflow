name: An issue that is not actually ready is bailed out to needs-info
skill: implement-github-issue
target: issue#12
world:
  issues:
    - {number: 12, state: open, labels: [ready-for-agent]}
expect:
  result: "#12 needs-info"
  effects:
    - {op: comment, target: "issue#12"}
    - {op: label_remove, target: "issue#12", label: ready-for-agent}
    - {op: label_add, target: "issue#12", label: needs-info}
