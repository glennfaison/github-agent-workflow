name: An issue whose PRs were all closed unmerged goes to a person
skill: reconcile-github-issues
world:
  issues:
    - {number: 12, state: open, labels: [agent:pr-open]}
  prs:
    - {number: 40, state: closed, labels: [], head: h1, closes: [12]}
expect:
  results: ["#12 ready-for-human: PR #40 closed without merging"]
  effects:
    - {op: label_remove, target: "issue#12", label: agent:pr-open}
    - {op: label_add, target: "issue#12", label: ready-for-human}
    - {op: comment, target: "issue#12"}
