name: When a trusted outcome names the state, the other labels are removed
skill: reconcile-github-issues
world:
  issues:
    - number: 12
      state: open
      labels: [needs-info, ready-for-human]
      comments:
        - {author: agent, trusted: true, marker: "agent:outcome"}
expect:
  results: ["#12 repaired: needs-info and ready-for-human to needs-info"]
  effects:
    - {op: label_remove, target: "issue#12", label: ready-for-human}
