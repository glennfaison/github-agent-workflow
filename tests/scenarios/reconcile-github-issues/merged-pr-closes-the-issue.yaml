name: An issue whose PR merged is closed
skill: reconcile-github-issues
world:
  issues:
    - {number: 12, state: open, labels: [agent:pr-open]}
  prs:
    - {number: 40, state: merged, labels: [], head: h1, closes: [12]}
expect:
  results: ["#12 closed: implemented in #40"]
  effects:
    - {op: label_remove, target: "issue#12", label: agent:pr-open}
    - {op: close, target: "issue#12"}
