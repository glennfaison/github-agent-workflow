name: An issue another run is triaging is skipped
why: "Issue #64. The oracle reads the lease: a lease label with a live lease means another run holds the issue."
skill: triage-github-issue
target: issue#12
world:
  issues:
    - {number: 12, state: open, labels: [needs-triage, "agent:triage"], lease: live}
expect:
  result: "#12 skipped: another run holds the lease"
  effects: []
