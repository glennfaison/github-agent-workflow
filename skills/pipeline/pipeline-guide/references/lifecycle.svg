<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="lifecycle-title lifecycle-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="lifecycle-title">The lifecycle at a glance</title>
  <desc id="lifecycle-desc">An issue moves from no state label through triage to ready-for-agent; implementing then sets agent:pr-open and the merge closes it. Triage can instead park the issue as needs-info, which a human clears, or ready-for-human. A PR moves between agent:needs-work and agent:ready-for-review through shepherding and review, and review can send it back. Any item, at any step, can become agent:stuck until a human removes the label. Label names and colours follow the labels reference in agent-workflow-protocol, which wins if a skill disagrees with it.</desc>

  <defs>
    <marker id="lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a" />
    </marker>
    <marker id="lifecycle-arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />

  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2328">The lifecycle at a glance</text>
  <text x="40" y="64" font-size="12" fill="#59636e">The rendered form of the plain-text diagram in the pipeline-guide skill. Label names and colours follow the labels reference, the source of truth.</text>

  <text x="40" y="106" font-size="10" font-weight="700" letter-spacing="1" fill="#8c959f">ISSUE</text>
  <text x="185" y="326" font-size="10" font-weight="700" letter-spacing="1" fill="#8c959f">PR</text>
  <text x="40" y="446" font-size="10" font-weight="700" letter-spacing="1" fill="#8c959f">ANY</text>

  <!-- issue row -->
  <rect x="40" y="120" width="115" height="44" rx="8" fill="#ffffff" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="97" y="147" font-size="12" fill="#59636e" text-anchor="middle">no state label</text>

  <rect x="250" y="120" width="140" height="44" rx="8" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5" />
  <text x="320" y="147" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ready-for-agent</text>

  <rect x="520" y="120" width="130" height="44" rx="8" fill="#0E8A16" stroke="#0E8A16" stroke-width="1.5" />
  <text x="585" y="147" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">agent:pr-open</text>

  <rect x="780" y="120" width="120" height="44" rx="8" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5" />
  <text x="840" y="147" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">closed</text>

  <line x1="155" y1="142" x2="247" y2="142" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <text x="200" y="132" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">triage</text>

  <line x1="390" y1="142" x2="517" y2="142" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <text x="455" y="132" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">implement</text>

  <line x1="650" y1="142" x2="777" y2="142" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <text x="714" y="132" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">merged</text>

  <!-- triage picks one of three outcomes -->
  <circle cx="200" cy="142" r="4" fill="#57606a" />
  <line x1="200" y1="142" x2="200" y2="178" stroke="#57606a" stroke-width="1.5" />
  <circle cx="200" cy="178" r="3.5" fill="#57606a" />

  <line x1="200" y1="178" x2="200" y2="207" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <rect x="135" y="210" width="130" height="44" rx="8" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5" />
  <text x="200" y="237" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">needs-info</text>
  <text x="200" y="276" font-size="11" fill="#59636e" text-anchor="middle">a human answers and removes the label:</text>
  <text x="200" y="291" font-size="11" fill="#59636e" text-anchor="middle">untouched, so triage sees it again</text>

  <path d="M 200 178 L 385 178 L 385 207" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <rect x="310" y="210" width="150" height="44" rx="8" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5" />
  <text x="385" y="237" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ready-for-human</text>

  <!-- a human answering sends the issue back to the start -->
  <path d="M 135 232 L 30 232 L 30 142 L 38 142" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />

  <!-- implementing opens a PR in the second row -->
  <path d="M 585 164 L 585 300 L 270 300 L 270 338" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lifecycle-arrow-faint)" />
  <text x="425" y="292" font-size="11" font-style="italic" fill="#8c959f" text-anchor="middle">a PR is opened and gets agent:needs-work</text>

  <!-- PR row -->
  <rect x="185" y="340" width="170" height="44" rx="8" fill="#D93F0B" stroke="#D93F0B" stroke-width="1.5" />
  <text x="270" y="367" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">agent:needs-work</text>

  <rect x="470" y="340" width="190" height="44" rx="8" fill="#0E8A16" stroke="#0E8A16" stroke-width="1.5" />
  <text x="565" y="367" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">agent:ready-for-review</text>

  <rect x="750" y="340" width="110" height="44" rx="8" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5" />
  <text x="805" y="367" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">merged</text>

  <line x1="355" y1="362" x2="467" y2="362" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <text x="411" y="352" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">shepherd</text>

  <line x1="660" y1="362" x2="747" y2="362" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <text x="704" y="352" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">review</text>

  <path d="M 565 384 L 565 424 L 270 424 L 270 386" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#lifecycle-arrow)" />
  <text x="417" y="416" font-size="11" font-style="italic" fill="#57606a" text-anchor="middle">sent back</text>

  <!-- escalation applies to every item in both rows -->
  <rect x="40" y="452" width="860" height="58" rx="8" fill="#B60205" stroke="#B60205" stroke-width="1.5" />
  <text x="470" y="477" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">agent:stuck: any item, at any step</text>
  <text x="470" y="497" font-size="12" fill="#ffffff" text-anchor="middle">An agent gave up. Every step ignores the item until a human removes the label.</text>

  <text x="480" y="540" font-size="11" fill="#8c959f" text-anchor="middle">Source of truth: the labels reference in agent-workflow-protocol. If a skill disagrees with it, the labels reference wins.</text>
</svg>
